[project]
name = "heart-disease-model"
version = "1.0.0"
description = "Heart disease prediction using UCI Cleveland dataset"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "streamlit==1.64.0",
]

[tool.uv]
dev-dependencies = [
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
]